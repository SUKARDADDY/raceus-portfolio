<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ariel Vaisman · AI-augmented engineer</title>
<meta name="description" content="AI-augmented engineer. Production systems built by directing AI agents: architecture, build, operations. Live MCP server, Cloudflare edge platforms, self-hosted model work.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#0d0d0d">
<meta name="build-sha" content="__BUILD_SHA__">
<meta property="og:title" content="Ariel Vaisman · AI-augmented engineer">
<meta property="og:description" content="Production systems built by directing AI agents. Live MCP server you can add to Claude in one click.">
<meta property="og:type" content="website">
<style>
  :root {
    --bg:       #0d0d0d;
    --fg:       #d6d3cd;
    --bright:   #f2efe9;
    --dim:      #8c8880;
    --faint:    #5a5750;
    --border:   #3a3833;
    --coral:    #d97757;
    --green:    #6cae5b;
    --blue:     #6ba3d6;
    --sel-bg:   #1c1b18;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 1.4rem 1rem 2rem;
    -webkit-font-smoothing: antialiased;
    font-variant-ligatures: none;
  }

  #term {
    max-width: 92ch;
    margin: 0 auto;
    overflow-x: auto;
    overflow-y: hidden;
  }

  /* every terminal row */
  .r { white-space: pre; }
  /* prose rows: reflow instead of clipping, keeping the ⎿ hanging indent */
  .rw { white-space: pre-wrap; padding-inline-start: 5ch; text-indent: -5ch; }

  .coral  { color: var(--coral); }
  .green  { color: var(--green); }
  .blue   { color: var(--blue); }
  .dim    { color: var(--dim); }
  .faint  { color: var(--faint); }
  .bright { color: var(--bright); }
  .border { color: var(--border); }

  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible { outline: 1px solid var(--coral); outline-offset: 2px; }

  /* Claude mark, sits inline in the welcome box row */
  .logo { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -0.24em; margin-inline-end: 0.15em; }
  .logo path { fill: var(--coral); }

  /* ── selection list ───────────────────────────────────────── */
  #list { margin: 0; }
  .item {
    display: block;
    white-space: pre;
    cursor: pointer;
    color: var(--fg);
    background: transparent;
    border: 0;
    font: inherit;
    text-align: start;
    width: 100%;
    padding: 0;
  }
  .item .marker { color: var(--coral); }
  .item[aria-selected="true"] { background: var(--sel-bg); color: var(--bright); }
  .item[aria-selected="true"] .pname { color: var(--bright); }
  .item:focus { outline: none; }
  .item .pname { color: var(--fg); }
  .item .desc  { color: var(--dim); }

  /* ── cursor + spinner ─────────────────────────────────────── */
  .cursor {
    display: inline-block; width: 0.6em; height: 1.05em;
    background: var(--fg); vertical-align: -0.18em;
    animation: blink 1.05s step-end infinite;
  }
  @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }

  .hidden { display: none; }

  /* Boxes: CSS borders rather than box-drawing characters. Visually the same
     rounded rectangle, but immune to the width of whatever is inside. */
  .box {
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0.45rem 0.85rem;
    margin: 0;
  }

  /* ── input box ────────────────────────────────────────────── */
  #entry {
    font: inherit; color: var(--fg); background: transparent;
    border: 0; outline: 0; padding: 0;
    width: 100%; caret-color: var(--fg);
  }
  /* While the field is empty the block cursor stands in, so suppress the
     native caret. Once there is text the native caret takes over, which keeps
     selection, paste and IME composition behaving normally. */
  #entry.empty { caret-color: transparent; }
  #inputrow { display: flex; align-items: baseline; }
  #inputrow .gt { color: var(--coral); }
  #inputwrap { flex: 1; position: relative; display: flex; align-items: baseline; }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }

  @media (max-width: 620px) {
    body { font-size: 12px; padding: 1rem 0.6rem 2rem; }
  }
  @media (max-width: 420px) {
    body { font-size: 11px; }
  }
</style>
</head>
<body>

<div id="term" role="region" aria-label="Terminal">

  <!-- welcome box ------------------------------------------------ -->
  <div id="welcome" aria-label="Welcome"></div>

  <div class="r">&nbsp;</div>

  <!-- boot transcript -------------------------------------------- -->
  <div id="boot"></div>

  <!-- project list ----------------------------------------------- -->
  <div id="listwrap" class="hidden">
    <div id="list" role="listbox" aria-label="Projects" tabindex="0"></div>
  </div>

  <!-- result of the last selection -------------------------------- -->
  <div id="result"></div>

  <div class="r">&nbsp;</div>

  <!-- input box --------------------------------------------------- -->
  <div id="inputbox" class="hidden">
    <div class="box"><div id="inputrow"><span class="gt">&gt;&nbsp;</span><span id="inputwrap"><span class="cursor" id="cur"></span><input id="entry" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Command input"></span></div></div>
    <div class="r faint" id="hints"></div>
  </div>

</div>

<noscript>
  <div style="max-width:80ch;margin:2rem auto;font-family:var(--mono);color:#d6d3cd">
    <p><strong>Ariel Vaisman</strong> · AI-augmented engineer · Nesher, Israel</p>
    <p style="margin:1rem 0">I ship production systems by directing AI agents: architecture, build, and operations. Seven years of operations underneath, so the systems I design are ones I also have to keep running.</p>
    <p>Projects: bugtracker-mcp (live · <a style="color:#6ba3d6" href="https://mcp.raceus.co.il">mcp.raceus.co.il</a> · <a style="color:#6ba3d6" href="https://github.com/SUKARDADDY/bugtracker-mcp">source</a>), multi-tenant-saas, ai-assistant, agent-workspace, sukarfleet, claude-chat-bridge, sukartask.</p>
    <p style="margin-top:1rem"><a style="color:#6ba3d6" href="mailto:ariel.vsn@gmail.com">ariel.vsn@gmail.com</a> · <a style="color:#6ba3d6" href="https://github.com/SUKARDADDY">github.com/SUKARDADDY</a></p>
  </div>
</noscript>

<script>
(function () {
  'use strict';

  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var MCP  = 'https://mcp.raceus.co.il/mcp';
  var DEEP = 'https://claude.ai/customize/connectors?modal=add-custom-connector'
           + '&mcpName=' + encodeURIComponent('Bug Tracker')
           + '&mcpServerUrl=' + encodeURIComponent(MCP);

  // Claude sparkle, drawn as tapered rays so it scales with the text.
  var LOGO = (function () {
    var rays = 12, out = '';
    for (var i = 0; i < rays; i++) {
      var a = (i * 2 * Math.PI) / rays;
      var long = (i % 3 === 0);
      var rO = long ? 15.2 : 11.4;   // ray length
      var w  = long ? 2.5 : 1.9;     // half-width at the hub
      var cx = 16, cy = 16;
      var hx = Math.cos(a + Math.PI / 2) * w, hy = Math.sin(a + Math.PI / 2) * w;
      var tx = cx + Math.cos(a) * rO,        ty = cy + Math.sin(a) * rO;
      out += 'M' + (cx + hx).toFixed(2) + ' ' + (cy + hy).toFixed(2)
           + 'L' + tx.toFixed(2) + ' ' + ty.toFixed(2)
           + 'L' + (cx - hx).toFixed(2) + ' ' + (cy - hy).toFixed(2) + 'Z';
    }
    return '<svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="' + out + '"/></svg>';
  })();

  var PROJECTS = [
    { name: 'bugtracker-mcp',     status: 'live',
      desc: 'Public MCP server · 11 tools, resources, prompts',
      url:  'https://mcp.raceus.co.il',
      repo: 'https://github.com/SUKARDADDY/bugtracker-mcp',
      long: 'Public MCP server over a bilingual issue tracker. All three protocol\n     primitives: 11 tools, addressable bug:// resources, server-provided\n     prompts. Bilingual Hebrew/English full-text search, binary image return\n     over MCP, nightly self-reseed. No auth.' },
    { name: 'multi-tenant-saas',  status: 'private',
      desc: 'Government-audited SaaS on Cloudflare edge',
      long: 'Government-approved, continuously audited multi-tenant SaaS on\n     Cloudflare Workers, D1, R2 and Durable Objects. Architected, shipped\n     and operated solo; compliance layer built in-house.' },
    { name: 'ai-assistant',       status: 'private',
      desc: 'Natural-Hebrew layer on a self-hosted Gemma 4',
      long: 'DokoPoint. Natural-Hebrew command layer inside a POS back-office:\n     customers run reports and manage products by asking. Self-hosted\n     Gemma 4 shared across the customer base, driven by prompt and tool\n     design rather than a hosted API.' },
    { name: 'agent-workspace',    status: 'private',
      desc: 'Multi-agent delivery workflow + LLM knowledge base',
      long: 'Parallel builders on isolated lanes, blind review rounds, staged\n     approval gates. Plus an LLM-queried knowledge base an engineering\n     team uses to recover how problems were reasoned through.' },
    { name: 'sukarfleet',         status: 'private',
      desc: 'Peer-to-peer fleet mesh · 580 tests',
      long: 'Peer-to-peer mesh keeping several machines in sync: encrypted\n     transport supervision, git-based replication, presence gossip,\n     sync-health alarms.' },
    { name: 'claude-chat-bridge', status: 'private',
      desc: 'Web chat UI over real Claude Code sessions',
      long: 'Web chat UI wired into interactive Claude Code sessions over the\n     official channel transport, with multi-thread conversations and\n     inline HTML artifacts. No API token, no separate credit pool.' },
    { name: 'sukartask',          status: 'private',
      desc: 'Task tracker shared across agent sessions',
      long: 'Work in progress on one machine stays visible from another.\n     Self-hosted behind access control.' }
  ];

  var term    = document.getElementById('term');
  var welcome = document.getElementById('welcome');
  var boot    = document.getElementById('boot');
  var listwrap= document.getElementById('listwrap');
  var list    = document.getElementById('list');
  var result  = document.getElementById('result');
  var inputbox= document.getElementById('inputbox');
  var entry   = document.getElementById('entry');
  var hints   = document.getElementById('hints');

  // ── terminal width, measured in characters ────────────────────
  var cols = 80;
  function measure() {
    var probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre';
    probe.textContent = '0'.repeat(100);
    term.appendChild(probe);
    var chw = probe.getBoundingClientRect().width / 100;
    term.removeChild(probe);
    cols = Math.max(30, Math.min(92, Math.floor(term.clientWidth / chw) - 1));
  }

  function pad(s, n) { return s.length >= n ? s.slice(0, n) : s + ' '.repeat(n - s.length); }
  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── welcome box ───────────────────────────────────────────────
  function drawWelcome() {
    welcome.className = 'box';
    welcome.innerHTML =
        '<div class="r">' + LOGO + '<span class="bright">Welcome to Ariel Vaisman</span></div>'
      + '<div class="r">&nbsp;</div>'
      + '<div class="r dim">AI-augmented engineer · Nesher, Israel</div>'
      + '<div class="r faint">↑↓ to browse projects · enter to open · ? for help</div>'
      + '<div class="r">&nbsp;</div>'
      + '<div class="r faint">cwd: ~/projects</div>';
  }

  // ── input box ─────────────────────────────────────────────────
  function drawInputBox() {
    hints.textContent = (cols < 52)
      ? '  tap a project · ? help'
      : '  ↑↓ navigate · enter open · tab describe · ? shortcuts';
  }

  // ── project list ──────────────────────────────────────────────
  var sel = 0;

  function drawList() {
    // Adapt the row to the measured terminal width: drop the description
    // entirely when there is no honest room for it, rather than clipping
    // mid-word. The full text is one keypress away via tab / enter.
    var wide   = cols >= 78;
    var medium = cols >= 66;
    var longest = PROJECTS.reduce(function (m, p) { return Math.max(m, p.name.length); }, 0);
    var nameW  = Math.max(longest, wide ? 20 : (medium ? 19 : 18));
    var showDesc = medium;

    var html = '';
    PROJECTS.forEach(function (p, i) {
      var on = i === sel;
      var num = (i + 1) + '. ';
      var flag = p.status === 'live'
        ? '<span class="green">● live   </span>'
        : '<span class="faint">○ private</span>';

      var row = '<span class="marker">' + (on ? '❯ ' : '  ') + '</span>'
              + '<span class="dim">' + num + '</span>'
              + '<span class="pname">' + pad(p.name, nameW) + '</span> '
              + flag;

      if (showDesc) {
        var used = 2 + num.length + nameW + 1 + 9 + 2;
        var descW = Math.max(0, cols - used - 2);   // 2 cols of slack
        var d = p.desc.length > descW ? p.desc.slice(0, Math.max(0, descW - 1)).replace(/[\s·]+$/, '') + '…' : p.desc;
        if (d) row += '  <span class="desc">' + esc(d) + '</span>';
      }

      html += '<span class="item" role="option" id="opt' + i + '" data-i="' + i + '"'
            + ' aria-selected="' + on + '" tabindex="-1">' + row + '</span>';
    });
    list.innerHTML = html;
    list.setAttribute('aria-activedescendant', 'opt' + sel);
  }

  function move(d) {
    sel = (sel + d + PROJECTS.length) % PROJECTS.length;
    drawList();
    var el = document.getElementById('opt' + sel);
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
  }

  // ── tool-result rendering ─────────────────────────────────────
  function showResult(lines) {
    result.innerHTML = '<div class="r">&nbsp;</div>' + lines.map(function (l) {
      return '<div class="r rw">' + l + '</div>';
    }).join('');
  }

  function openProject(i) {
    var p = PROJECTS[i];
    if (p.url) {
      showResult([
        '<span class="coral">⏺</span> open(<span class="bright">' + p.name + '</span>)',
        '  <span class="faint">⎿</span>  <span class="dim">opening </span><span class="blue">' + p.url + '</span><span class="dim"> in a new tab</span>'
      ]);
      window.open(p.url, '_blank', 'noopener');
    } else {
      showResult([
        '<span class="coral">⏺</span> open(<span class="bright">' + p.name + '</span>)',
        '  <span class="faint">⎿</span>  <span class="dim">private · no public link</span>',
        '     <span class="faint">' + esc(p.long.split('\n')[0].trim()) + '</span>'
      ]);
    }
  }

  function describe(i) {
    var p = PROJECTS[i];
    var links = [];
    if (p.url)  links.push('<span class="blue">' + p.url + '</span>');
    if (p.repo) links.push('<span class="blue">' + p.repo + '</span>');
    showResult([
      '<span class="coral">⏺</span> cat(<span class="bright">' + p.name + '</span>)',
      '  <span class="faint">⎿</span>  <span class="dim">' + esc(p.long) + '</span>'
    ].concat(links.length ? ['     ' + links.join('  ')] : []));
  }

  // ── boot sequence ─────────────────────────────────────────────
  var SPIN = ['·','✢','✳','∗','✻','✽','✻','∗','✳','✢'];

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, REDUCED ? 0 : ms); }); }

  function typeInto(el, text, speed) {
    return new Promise(function (done) {
      if (REDUCED) { el.textContent = text; return done(); }
      var i = 0;
      (function step() {
        el.textContent = text.slice(0, ++i);
        if (i < text.length) setTimeout(step, speed);
        else done();
      })();
    });
  }

  function spinner(label, ms) {
    return new Promise(function (done) {
      var line = document.createElement('div');
      line.className = 'r';
      boot.appendChild(line);
      if (REDUCED) { boot.removeChild(line); return done(); }
      var t0 = Date.now(), k = 0, iv = setInterval(function () {
        var secs = Math.floor((Date.now() - t0) / 1000);
        line.innerHTML = '<span class="coral">' + SPIN[k++ % SPIN.length] + '</span> '
          + '<span class="dim">' + label + '… </span>'
          + '<span class="faint">(' + secs + 's · esc to interrupt)</span>';
      }, 110);
      setTimeout(function () { clearInterval(iv); boot.removeChild(line); done(); }, ms);
    });
  }

  function appendRowsWrap(rows) {
    var frag = document.createElement('div');
    frag.innerHTML = rows.map(function (r) { return '<div class="r rw">' + r + '</div>'; }).join('');
    while (frag.firstChild) boot.appendChild(frag.firstChild);
  }

  function appendRows(rows) {
    var frag = document.createElement('div');
    frag.innerHTML = rows.map(function (r) { return '<div class="r">' + r + '</div>'; }).join('');
    while (frag.firstChild) boot.appendChild(frag.firstChild);
  }

  var WHOAMI_1 = 'I ship production systems by <span class="bright">directing AI agents</span>: '
    + 'architecture, build, and operations. Solo-built a government-audited multi-tenant SaaS on '
    + "Cloudflare's edge, shipped an in-product AI assistant on a self-hosted model, and built the "
    + 'MCP tooling and agent workflows my team works through.';
  var WHOAMI_2 = 'Seven years of operations sit underneath all of it, so the systems I design are '
    + 'ones I also have to keep running.';

  function promptLine() {
    var d = document.createElement('div');
    d.className = 'r';
    d.innerHTML = '<span class="coral">&gt;</span> <span class="cmdtext"></span>';
    boot.appendChild(d);
    return d.querySelector('.cmdtext');
  }

  async function bootSeq() {
    // > whoami
    var t1 = promptLine();
    await typeInto(t1, 'whoami', 55);
    await sleep(280);
    await spinner('Thinking', 900);
    appendRows(['<span class="coral">⏺</span> whoami']);
    appendRowsWrap(['  <span class="faint">⎿</span>  <span class="dim">' + WHOAMI_1 + '</span>']);
    await sleep(90);
    appendRowsWrap(['     <span class="dim">' + WHOAMI_2 + '</span>']);
    appendRows(['&nbsp;']);

    // > ls ~/projects
    var t2 = promptLine();
    await typeInto(t2, 'ls ~/projects', 55);
    await sleep(240);
    await spinner('Listing', 620);
    appendRows([
      '<span class="coral">⏺</span> ls(<span class="bright">~/projects</span>)',
      '  <span class="faint">⎿</span>  <span class="dim">' + PROJECTS.length
        + ' projects · <span class="green">1 live</span> · ' + (PROJECTS.length - 1) + ' private</span>',
      '&nbsp;'
    ]);

    listwrap.classList.remove('hidden');
    drawList();
    inputbox.classList.remove('hidden');
    drawInputBox();
    list.focus({ preventScroll: true });
  }

  // ── commands typed into the box ───────────────────────────────
  function runCommand(raw) {
    var input = raw.trim();
    if (!input) return;
    var parts = input.replace(/^\//, '').split(/\s+/);
    var cmd = parts[0].toLowerCase();
    var arg = parts.slice(1).join(' ').toLowerCase();

    if (cmd === 'help' || cmd === '?') {
      return showResult([
        '<span class="coral">⏺</span> help',
        '  <span class="faint">⎿</span>  <span class="dim">↑↓ / jk    move between projects</span>',
        '     <span class="dim">enter      open the selected project</span>',
        '     <span class="dim">tab        show full description</span>',
        '     <span class="dim">1-' + PROJECTS.length + '        jump to a project</span>',
        '     <span class="dim">mcp        add the MCP server to Claude</span>',
        '     <span class="dim">contact    email and github</span>',
        '     <span class="dim">stack      languages and tooling</span>',
        '     <span class="dim">clear      clear output</span>'
      ]);
    }
    if (cmd === 'clear') { result.innerHTML = ''; return; }
    if (cmd === 'contact') {
      return showResult([
        '<span class="coral">⏺</span> cat(<span class="bright">contact</span>)',
        '  <span class="faint">⎿</span>  <a href="mailto:ariel.vsn@gmail.com">ariel.vsn@gmail.com</a>',
        '     <a href="https://github.com/SUKARDADDY">github.com/SUKARDADDY</a>',
        '     <span class="dim">Hebrew native · English work proficient · Russian fluent</span>'
      ]);
    }
    if (cmd === 'stack') {
      return showResult([
        '<span class="coral">⏺</span> cat(<span class="bright">stack</span>)',
        '  <span class="faint">⎿</span>  <span class="dim">languages  JavaScript · TypeScript · SQL · Bash</span>',
        '     <span class="dim">ai         MCP servers · self-hosted model serving · prompt and</span>',
        '     <span class="dim">           tool design · multi-agent orchestration</span>',
        '     <span class="dim">platform   Cloudflare Workers, D1, R2, Durable Objects</span>'
      ]);
    }
    if (cmd === 'mcp') {
      showResult([
        '<span class="coral">⏺</span> mcp(<span class="bright">add</span>)',
        '  <span class="faint">⎿</span>  <span class="dim">opening Claude\'s connector dialog for </span><span class="blue">' + MCP + '</span>'
      ]);
      if (navigator.clipboard) navigator.clipboard.writeText(MCP).catch(function () {});
      window.open(DEEP, '_blank', 'noopener');
      return;
    }
    if (cmd === 'ls') { listwrap.classList.remove('hidden'); return showResult([]); }
    if (cmd === 'open' || cmd === 'cat') {
      var idx = PROJECTS.findIndex(function (p) { return p.name === arg; });
      if (idx < 0) return showResult([
        '<span class="coral">⏺</span> ' + esc(cmd) + '(<span class="bright">' + esc(arg || '?') + '</span>)',
        '  <span class="faint">⎿</span>  <span class="coral">no such project</span>'
      ]);
      sel = idx; drawList();
      return cmd === 'open' ? openProject(idx) : describe(idx);
    }
    showResult([
      '<span class="coral">⏺</span> ' + esc(cmd),
      '  <span class="faint">⎿</span>  <span class="coral">command not found</span><span class="dim"> · try help</span>'
    ]);
  }

  // ── keyboard ──────────────────────────────────────────────────
  function onKey(e) {
    // let the user type real commands without hijacking every key
    var typing = document.activeElement === entry && entry.value.length > 0;

    if (e.key === 'ArrowDown' || (!typing && e.key === 'j')) { move(1);  e.preventDefault(); return; }
    if (e.key === 'ArrowUp'   || (!typing && e.key === 'k')) { move(-1); e.preventDefault(); return; }
    if (e.key === 'Home') { sel = 0; drawList(); e.preventDefault(); return; }
    if (e.key === 'End')  { sel = PROJECTS.length - 1; drawList(); e.preventDefault(); return; }

    if (e.key === 'Enter') {
      if (typing) { runCommand(entry.value); entry.value = ''; syncCursor(); }
      else openProject(sel);
      e.preventDefault(); return;
    }
    if (e.key === 'Tab' && !typing) { describe(sel); e.preventDefault(); return; }
    if (e.key === '?' && !typing)   { runCommand('help'); e.preventDefault(); return; }

    if (!typing && /^[1-9]$/.test(e.key)) {
      var n = parseInt(e.key, 10) - 1;
      if (n < PROJECTS.length) { sel = n; drawList(); e.preventDefault(); }
      return;
    }
    // anything else printable goes to the input box
    if (!typing && e.key.length === 1 && !e.metaKey && !e.ctrlKey) {
      entry.focus({ preventScroll: true });
    }
  }

  document.addEventListener('keydown', onKey);

  var cur = document.getElementById('cur');
  function syncCursor() {
    var empty = entry.value.length === 0;
    cur.style.display = empty ? 'inline-block' : 'none';
    entry.classList.toggle('empty', empty);
  }
  ['input', 'keyup', 'paste', 'cut', 'focus', 'blur'].forEach(function (ev) {
    entry.addEventListener(ev, function () { setTimeout(syncCursor, 0); });
  });
  syncCursor();

  // clicking anywhere that isn't a link focuses the prompt
  document.addEventListener('click', function (e) {
    var item = e.target.closest ? e.target.closest('.item') : null;
    if (item) {
      sel = +item.dataset.i; drawList(); openProject(sel); return;
    }
    if (!e.target.closest || !e.target.closest('a')) entry.focus({ preventScroll: true });
  });

  // hover selects, like a real TUI
  list.addEventListener('mouseover', function (e) {
    var item = e.target.closest ? e.target.closest('.item') : null;
    if (item) { sel = +item.dataset.i; drawList(); }
  });

  // ── init ──────────────────────────────────────────────────────
  function redraw() { measure(); drawWelcome(); drawInputBox(); if (!listwrap.classList.contains('hidden')) drawList(); }
  var rt;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(redraw, 120); });

  measure();
  drawWelcome();
  drawInputBox();
  bootSeq();
})();
</script>
</body>
</html>
